name: workday-automation-audit

on:
  push:
    paths:
      - "demos/workday-automation-audit/**"
      - ".github/workflows/workday-automation-audit.yml"
  pull_request:
    paths:
      - "demos/workday-automation-audit/**"
      - ".github/workflows/workday-automation-audit.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        run: pip install -r demos/workday-automation-audit/requirements.txt
      - name: Pytest (mock mode, no API key)
        working-directory: demos/workday-automation-audit
        run: python -m pytest -q tests
