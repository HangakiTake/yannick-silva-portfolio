name: ai-opportunity-scoping

on:
  pull_request:
    paths:
      - "demos/ai-opportunity-scoping/**"
      - ".github/workflows/ai-opportunity-scoping.yml"
  push:
    branches: [main]
    paths:
      - "demos/ai-opportunity-scoping/**"
      - ".github/workflows/ai-opportunity-scoping.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Python tests (mock mode, no API key)
        working-directory: demos/ai-opportunity-scoping
        run: |
          python -m pip install -r requirements.txt
          python -m pytest -q
      - name: Node client (mock mode, no API key)
        working-directory: demos/ai-opportunity-scoping/node
        run: |
          npm ci
          npm test
